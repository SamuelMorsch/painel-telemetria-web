name: CI - Painel Web

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout do código (histórico completo, exigido pelo SonarQube Cloud)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes (com cobertura)
        run: npm test
      - name: Análise SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Build de produção
        run: npm run build

  docker:
    needs: test-build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v5
      - name: Login no GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build e publicação da imagem
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/painel-telemetria-web"
          TAG="${GITHUB_REF_NAME//\//-}"
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:${GITHUB_SHA::7}" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:${GITHUB_SHA::7}"
